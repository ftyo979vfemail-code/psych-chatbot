<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عقل — مساعد علم النفس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b10;
    --bg-panel: #12141c;
    --bg-input: #171a24;
    --bg-sidebar: #0d0e15;
    --border: #262a38;
    --violet: #8b7bff;
    --violet-dim: #4a3f8f;
    --teal: #4fd9c8;
    --text: #e7e6ee;
    --text-dim: #8b8ea3;
    --danger: #ff6b7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse at top left, #14172280, transparent 60%), var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    height:100vh;
    display:flex;
    overflow:hidden;
  }
  #sidebar{
    width:260px;
    background: var(--bg-sidebar);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  #sidebar-header{ padding:16px; border-bottom:1px solid var(--border); }
  #newChatBtn{
    width:100%;
    background: transparent;
    border:1px solid var(--violet-dim);
    color: var(--violet);
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    transition:.15s;
  }
  #newChatBtn:hover{ background: var(--violet); color:#0a0b10; }
  #sessionList{ flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
  .session-item{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    color: var(--text-dim);
    cursor:pointer;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:.15s;
  }
  .session-item:hover{ background: var(--bg-panel); color: var(--text); }
  .session-item.active{ background: var(--bg-panel); color: var(--text); border:1px solid var(--violet-dim); }
  .session-item .del-btn{
    opacity:0; background:none; border:none; color:var(--danger); cursor:pointer; font-size:14px; flex-shrink:0;
  }
  .session-item:hover .del-btn{ opacity:1; }
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  header{
    display:flex; align-items:center; gap:12px;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
    background: var(--bg-panel);
  }
  .pulse-dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--teal);
    box-shadow: 0 0 12px var(--teal);
    animation: pulse 2s infinite ease-in-out;
    flex-shrink:0;
  }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  header h1{ font-size:16px; font-weight:600; letter-spacing:.3px; }
  header p{ font-size:12px; color:var(--text-dim); font-family:'JetBrains Mono', monospace; }
  #chat{
    flex:1;
    overflow-y:auto;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:18px;
    max-width:760px;
    width:100%;
    margin:0 auto;
  }
  .msg{ display:flex; flex-direction:column; gap:6px; max-width:85%; }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  .msg.bot{ align-self:flex-start; align-items:flex-start; }
  .bubble{
    padding:14px 16px;
    border-radius:14px;
    line-height:1.8;
    font-size:15px;
    white-space:pre-wrap;
  }
  .msg.user .bubble{
    background: linear-gradient(135deg, var(--violet), #6a5acd);
    color:#0a0b10;
    border-bottom-left-radius:4px;
    font-weight:500;
  }
  .msg.bot .bubble{
    background: var(--bg-panel);
    border:1px solid var(--border);
    border-bottom-right-radius:4px;
  }
  .sources{ display:flex; flex-wrap:wrap; gap:6px; font-family:'JetBrains Mono', monospace; font-size:11px; }
  .sources a{
    color: var(--teal);
    text-decoration:none;
    border:1px solid var(--violet-dim);
    padding:4px 8px;
    border-radius:20px;
    background:#171a2480;
    transition:.15s;
    direction:ltr;
    unicode-bidi:embed;
  }
  .sources a:hover{ border-color:var(--teal); background:#1a2626; }
  .disclaimer{
    font-size:11px; color:var(--text-dim); text-align:center;
    padding:8px 24px; font-family:'JetBrains Mono', monospace;
    border-top:1px solid var(--border);
  }
  #inputBar{
    display:flex; gap:10px; padding:16px 24px 20px;
    max-width:760px; width:100%; margin:0 auto;
  }
  #inputBar input{
    flex:1;
    background: var(--bg-input);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:12px;
    font-size:15px;
    font-family:inherit;
    outline:none;
  }
  #inputBar input:focus{ border-color: var(--violet); }
  #inputBar button{
    background: var(--violet);
    color:#0a0b10;
    border:none;
    padding:0 22px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    font-size:15px;
    transition:.15s;
  }
  #inputBar button:hover{ background: var(--teal); }
  #inputBar button:disabled{ opacity:.4; cursor:not-allowed; }
  .typing{ display:flex; gap:4px; padding:4px 0; }
  .typing span{ width:6px; height:6px; border-radius:50%; background:var(--text-dim); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
  #chat::-webkit-scrollbar, #sessionList::-webkit-scrollbar{ width:6px; }
  #chat::-webkit-scrollbar-thumb, #sessionList::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }
  .empty-state{ color:var(--text-dim); font-size:13px; text-align:center; padding:24px 12px; }
</style>
</head>
<body>
  <div id="sidebar">
  <div id="sidebar-header">
    <button id="newChatBtn">+ محادثة جديدة</button>
  </div>
  <div id="sessionList">
    <div class="empty-state">لا توجد محادثات بعد</div>
  </div>
</div>

<div id="main">
  <header>
    <div class="pulse-dot"></div>
    <div>
      <h1>عقل — مساعد علم النفس</h1>
      <p>PSYCH_ASSISTANT / v2 · DB_ENABLED</p>
    </div>
  </header>

  <div id="chat"></div>

  <div class="disclaimer">
    محتوى تعليمي عام وليس بديلاً عن استشارة مختص نفسي أو طبي. في حال أزمة نفسية، تواصل فورًا مع خط مساعدة محلي.
  </div>

  <div id="inputBar">
    <input id="userInput" type="text" placeholder="اسأل عن أي موضوع في علم النفس..." />
    <button id="sendBtn">إرسال</button>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8000";

  const chatEl = document.getElementById('chat');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const sessionListEl = document.getElementById('sessionList');
  const newChatBtn = document.getElementById('newChatBtn');

  let currentSessionId = localStorage.getItem('psych_current_session') || null;

  function setCurrentSession(id) {
    currentSessionId = id;
    if (id) localStorage.setItem('psych_current_session', id);
    else localStorage.removeItem('psych_current_session');
  }

  function renderWelcome() {
    chatEl.innerHTML = '';
    addMessage('bot', 'أهلاً بك 👋 اسألني عن أي موضوع في علم النفس — القلق، النوم، العلاقات، التحفيز، أو أي شيء يخطر ببالك، وسأرفق لك مصادر موثوقة مع كل إجابة.');
  }

  function addMessage(role, text, sources = []) {
    const wrap = document.createElement('div');
    wrap.className = `msg ${role === 'user' ? 'user' : 'bot'}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);

    if (sources && sources.length) {
      const srcWrap = document.createElement('div');
      srcWrap.className = 'sources';
      sources.forEach(s => {
        const a = document.createElement('a');
        a.href = s.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = '↗ ' + (s.title || s.url);
        srcWrap.appendChild(a);
      });
      wrap.appendChild(srcWrap);
    }

    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typingIndicator';
    wrap.innerHTML = `<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }
  async function loadSessions() {
    try {
      const res = await fetch(`${API_BASE}/sessions`);
      if (!res.ok) throw new Error();
      const sessions = await res.json();
      renderSessionList(sessions);
    } catch (err) {
      sessionListEl.innerHTML = '<div class="empty-state">تعذّر تحميل المحادثات — تأكد أن الخادم يعمل</div>';
    }
  }

  function renderSessionList(sessions) {
    sessionListEl.innerHTML = '';
    if (!sessions.length) {
      sessionListEl.innerHTML = '<div class="empty-state">لا توجد محادثات بعد</div>';
      return;
    }
    sessions.forEach(s => {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
      item.innerHTML = `<span>${s.title}</span><button class="del-btn" title="حذف">✕</button>`;
      item.querySelector('span').addEventListener('click', () => openSession(s.id));
      item.querySelector('.del-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSession(s.id);
      });
      sessionListEl.appendChild(item);
    });
  }

  async function openSession(id) {
    setCurrentSession(id);
    try {
      const res = await fetch(`${API_BASE}/sessions/${id}`);
      if (!res.ok) throw new Error();
      const data = await res.json();
      chatEl.innerHTML = '';
      data.messages.forEach(m => addMessage(m.role === 'user' ? 'user' : 'bot', m.content, m.sources));
      loadSessions();
    } catch (err) {
      console.error(err);
    }
  }

  async function deleteSession(id) {
    if (!confirm('حذف هذه المحادثة نهائيًا؟')) return;
    try {
      await fetch(`${API_BASE}/sessions/${id}`, { method: 'DELETE' });
      if (id === currentSessionId) {
        setCurrentSession(null);
        renderWelcome();
      }
      loadSessions();
    } catch (err) {
      console.error(err);
    }
  }

  newChatBtn.addEventListener('click', () => {
    setCurrentSession(null);
    renderWelcome();
    loadSessions();
  });

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    input.value = '';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: currentSessionId })
      });
      if (!res.ok) throw new Error('فشل الاتصال بالخادم');
      const data = await res.json();

      removeTyping();
      addMessage('bot', data.reply, data.sources);

      const isNewSession = !currentSessionId;
      setCurrentSession(data.session_id);
      if (isNewSession) loadSessions();
    } catch (err) {
      removeTyping();
      addMessage('bot', 'تعذّر الاتصال بالخادم. تأكد أن السيرفر يعمل على ' + API_BASE);
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  loadSessions();
  if (currentSessionId) {
    openSession(currentSessionId);
  } else {
    renderWelcome();
  }
</script>

</body>
</html>
